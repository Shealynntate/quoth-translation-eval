[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gloss-eval"
version = "0.1.0"
description = "Pass-rate evaluation of span-exact Spanish-to-English glosses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shealyn Hindenlang" }]
dependencies = ["anthropic>=0.117,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["gloss_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
